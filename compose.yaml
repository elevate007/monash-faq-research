services:
  api:
    build: .
    environment:
      FAQ_BACKEND: ${FAQ_BACKEND:-extractive}
      FAQ_RESPONSE_MODE: ${FAQ_RESPONSE_MODE:-grounded}
      FAQ_DEVICE: cpu
      FAQ_ADAPTER_DIR: /app/models/monash_qa_adapter
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - model_cache:/cache
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.3.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on: [api]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/faq.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/faq.yml:ro
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/faq.json:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
volumes:
  model_cache:
  prometheus_data:
  grafana_data:
